name: Daily Sync (backup trigger)

# Backup/trigger for the Supabase pg_cron daily sync.
# Primary scheduler is pg_cron inside Supabase (see supabase/migrations/0002_cron.sql).
# This workflow provides a redundant daily trigger + a manual button.
on:
  schedule:
    - cron: '0 12 * * *' # daily ~08:00 ET
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Invoke cron-trigger Edge Function
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          : "${CRON_SECRET:?Missing CRON_SECRET secret}"
          : "${SUPABASE_URL:?Missing SUPABASE_URL secret}"
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 180 \
            --retry 3 --retry-delay 10 --retry-max-time 600 \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${SUPABASE_URL%/}/functions/v1/cron-trigger"
